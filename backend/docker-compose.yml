services:
  web:
    build:
      context: .
    container_name: light_django_backend
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,web,dev.bridgeus.work"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080,https://dev.bridgeus.work"
      CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080,https://dev.bridgeus.work"
      REDIS_URL: "redis://redis:6379/1"
      USE_REDIS_CACHE: "true"
      SQLITE_PATH: "/data/db.sqlite3"
      CHROMA_PERSIST_DIR: "/data/chroma"
      HF_HOME: "/data/huggingface"
      PORT: "8005"
      GUNICORN_WORKERS: "2"
      GUNICORN_TIMEOUT: "180"
    ports:
      - "8005:8005"
    depends_on:
      - redis
    volumes:
      - app_data:/data

  redis:
    image: redis:7-alpine
    container_name: light_django_redis
    restart: unless-stopped

volumes:
  app_data:
